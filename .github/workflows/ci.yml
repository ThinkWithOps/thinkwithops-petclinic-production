name: CI

# All actions below are pinned to a commit SHA (verified via `gh api
# repos/<owner>/<repo>/git/refs/tags/<tag>`), with the released version kept
# as a trailing comment. See docs/adr/0006-actions-pinned-by-sha.md.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Deny by default at workflow level; each job below grants only what it needs.
permissions: {}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-test:
    name: Build & test (mvnw verify)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Testcontainers integration tests need a Docker daemon. ubuntu-latest runners
      # ship Docker preinstalled and running, so ./mvnw verify (which triggers the
      # spring-boot-testcontainers / docker-compose support) works unmodified here.
      - name: mvnw verify (compile + test + coverage, once)
        run: ./mvnw -B -ntp verify
      - name: Publish test results to PR
        uses: mikepenz/action-junit-report@db71d41eb79864e25ab0337e395c352e84523afe # v4.3.1
        if: always()
        with:
          report_paths: 'target/surefire-reports/*.xml'
      - name: Upload JAR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-jar
          path: target/spring-petclinic-*.jar
          retention-days: 14
      - name: Upload surefire reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 14
      - name: Upload coverage (jacoco)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 14

  quality-gate:
    name: SonarQube Cloud quality gate
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: mvnw verify (regenerate coverage for Sonar; test cache makes this fast)
        run: ./mvnw -B -ntp verify
      - name: SonarQube Cloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # sonar.organization is SonarQube Cloud-specific (Community Edition,
        # used by the local Jenkins path, doesn't support organizations at
        # all), so it's passed here rather than as a shared pom.xml property.
        run: >
          ./mvnw -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:5.1.0.4751:sonar
          -Dsonar.organization=thinkwithops
          -Dsonar.qualitygate.wait=true

  image:
    name: Build image (not pushed)
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image-ref: ${{ steps.meta.outputs.ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.11.1
      # GHCR requires a lowercase repository path; github.repository preserves
      # the org/repo's actual casing (e.g. an uppercase org name), which Docker
      # rejects outright ("repository name must be lowercase").
      - name: Normalize image name to lowercase
        run: echo "IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: Compute short SHA tag
        id: meta
        run: echo "ref=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Build and load
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.18.0
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.ref }}
          build-args: |
            SOURCE=https://github.com/${{ github.repository }}
            REVISION=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Export image as artifact
        run: docker save "${IMAGE_NAME}:${{ steps.meta.outputs.ref }}" -o image.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-tar
          path: image.tar
          retention-days: 7

  trivy:
    name: Trivy scan (image the exact image from build)
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: image-tar
      - name: Load image
        run: docker load -i image.tar
      - name: Trivy vulnerability scan (fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@dc5a429b52fcf669ce959baa2c2dd26090d2a6c4 # v0.32.0
        with:
          input: image.tar
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore
      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@87ef0dc97def48aa960fbf026a2563ee9dbdb470 # v3.30.5
        with:
          sarif_file: trivy-results.sarif
      - name: Generate CycloneDX SBOM
        if: always()
        uses: aquasecurity/trivy-action@dc5a429b52fcf669ce959baa2c2dd26090d2a6c4 # v0.32.0
        with:
          input: image.tar
          format: cyclonedx
          output: sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 30

  config-scan:
    name: Checkov + shellcheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Checkov (dockerfile + github_actions)
        uses: bridgecrewio/checkov-action@5798bad4f6dd9c1fb67ae3ec10d42d8fb67037c4 # v12.3126.0
        with:
          config_file: .checkov.yaml
          output_format: sarif
          output_file_path: checkov-results.sarif
      - name: Upload Checkov SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@87ef0dc97def48aa960fbf026a2563ee9dbdb470 # v3.30.5
        with:
          sarif_file: checkov-results.sarif
      - name: shellcheck scripts/
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          find scripts -name '*.sh' -print0 | xargs -0 shellcheck

  publish:
    name: Publish to GHCR (push to main only)
    needs: [build-test, quality-gate, trivy, config-scan, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Normalize image name to lowercase
        run: echo "IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Load the EXACT image built and scanned in the `image`/`trivy` jobs — do not
      # rebuild here. Rebuilding would risk a different digest than what Trivy
      # actually scanned, defeating the "tested image == shipped image" guarantee.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: image-tar
      - name: Load and push the scanned image
        run: |
          docker load -i image.tar
          digest_before=$(docker image inspect "${IMAGE_NAME}:${{ needs.image.outputs.image-ref }}" --format '{{.Id}}')
          docker push "${IMAGE_NAME}:${{ needs.image.outputs.image-ref }}"
          echo "Pushed image with local digest: $digest_before"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sbom
      - name: Attach SBOM to release artifacts store
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-${{ needs.image.outputs.image-ref }}
          path: sbom.cdx.json
          retention-days: 90
