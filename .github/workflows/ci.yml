name: CI

# SUPPLY-CHAIN NOTE: every `uses:` below should be pinned to a commit SHA, not a
# floating tag, before this workflow is trusted in production (scanner/build actions
# are themselves a supply-chain target). SHAs were not independently verified when
# this file was written — see docs/adr/0006-actions-pinned-by-sha.md. Pin each
# action to its released tag's commit SHA and keep the version as a trailing comment,
# e.g. `uses: actions/checkout@<sha> # v4.2.2`, before relying on this pipeline.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-test:
    name: Build & test (mvnw verify)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4 # TODO: pin to commit SHA
      - uses: actions/setup-java@v4 # TODO: pin to commit SHA
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Testcontainers integration tests need a Docker daemon. ubuntu-latest runners
      # ship Docker preinstalled and running, so ./mvnw verify (which triggers the
      # spring-boot-testcontainers / docker-compose support) works unmodified here.
      - name: mvnw verify (compile + test + coverage, once)
        run: ./mvnw -B -ntp verify
      - name: Publish test results to PR
        uses: mikepenz/action-junit-report@v4 # TODO: pin to commit SHA
        if: always()
        with:
          report_paths: 'target/surefire-reports/*.xml'
      - name: Upload JAR
        uses: actions/upload-artifact@v4 # TODO: pin to commit SHA
        with:
          name: app-jar
          path: target/spring-petclinic-*.jar
          retention-days: 14
      - name: Upload surefire reports
        uses: actions/upload-artifact@v4 # TODO: pin to commit SHA
        if: always()
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 14
      - name: Upload coverage (jacoco)
        uses: actions/upload-artifact@v4 # TODO: pin to commit SHA
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 14

  quality-gate:
    name: SonarQube Cloud quality gate
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4 # TODO: pin to commit SHA
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4 # TODO: pin to commit SHA
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: mvnw verify (regenerate coverage for Sonar; test cache makes this fast)
        run: ./mvnw -B -ntp verify
      - name: SonarQube Cloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          ./mvnw -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.qualitygate.wait=true

  image:
    name: Build image (not pushed)
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image-ref: ${{ steps.meta.outputs.ref }}
    steps:
      - uses: actions/checkout@v4 # TODO: pin to commit SHA
      - uses: docker/setup-buildx-action@v3 # TODO: pin to commit SHA
      - name: Compute short SHA tag
        id: meta
        run: echo "ref=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Build and load
        uses: docker/build-push-action@v6 # TODO: pin to commit SHA
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.ref }}
          build-args: |
            SOURCE=https://github.com/${{ github.repository }}
            REVISION=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Export image as artifact
        run: docker save "${IMAGE_NAME}:${{ steps.meta.outputs.ref }}" -o image.tar
      - uses: actions/upload-artifact@v4 # TODO: pin to commit SHA
        with:
          name: image-tar
          path: image.tar
          retention-days: 7

  trivy:
    name: Trivy scan (image the exact image from build)
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4 # TODO: pin to commit SHA
      - uses: actions/download-artifact@v4 # TODO: pin to commit SHA
        with:
          name: image-tar
      - name: Load image
        run: docker load -i image.tar
      - name: Trivy vulnerability scan (fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@0.32.0 # TODO: pin to commit SHA
        with:
          input: image.tar
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore
      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3 # TODO: pin to commit SHA
        with:
          sarif_file: trivy-results.sarif
      - name: Generate CycloneDX SBOM
        if: always()
        uses: aquasecurity/trivy-action@0.32.0 # TODO: pin to commit SHA
        with:
          input: image.tar
          format: cyclonedx
          output: sbom.cdx.json
      - uses: actions/upload-artifact@v4 # TODO: pin to commit SHA
        if: always()
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 30

  config-scan:
    name: Checkov + shellcheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4 # TODO: pin to commit SHA
      - name: Checkov (dockerfile + github_actions)
        uses: bridgecrewio/checkov-action@master # TODO: pin to commit SHA
        with:
          config_file: .checkov.yaml
          output_format: sarif
          output_file_path: checkov-results.sarif
      - name: Upload Checkov SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3 # TODO: pin to commit SHA
        with:
          sarif_file: checkov-results.sarif
      - name: shellcheck scripts/
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          find scripts -name '*.sh' -print0 | xargs -0 shellcheck

  publish:
    name: Publish to GHCR (push to main only)
    needs: [build-test, quality-gate, trivy, config-scan, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v3 # TODO: pin to commit SHA
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Load the EXACT image built and scanned in the `image`/`trivy` jobs — do not
      # rebuild here. Rebuilding would risk a different digest than what Trivy
      # actually scanned, defeating the "tested image == shipped image" guarantee.
      - uses: actions/download-artifact@v4 # TODO: pin to commit SHA
        with:
          name: image-tar
      - name: Load and push the scanned image
        run: |
          docker load -i image.tar
          digest_before=$(docker image inspect "${IMAGE_NAME}:${{ needs.image.outputs.image-ref }}" --format '{{.Id}}')
          docker push "${IMAGE_NAME}:${{ needs.image.outputs.image-ref }}"
          echo "Pushed image with local digest: $digest_before"
      - uses: actions/download-artifact@v4 # TODO: pin to commit SHA
        with:
          name: sbom
      - name: Attach SBOM to release artifacts store
        uses: actions/upload-artifact@v4 # TODO: pin to commit SHA
        with:
          name: sbom-${{ needs.image.outputs.image-ref }}
          path: sbom.cdx.json
          retention-days: 90
