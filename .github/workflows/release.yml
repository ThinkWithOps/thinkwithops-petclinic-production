name: Release

# All actions below are pinned to a commit SHA. See docs/adr/0006-actions-pinned-by-sha.md.

# Triggered by ci.yml finishing, not by push directly. Hit for real: on a
# plain `push: branches: [main]` trigger, this workflow ran concurrently
# with ci.yml and tried to pull the sha-<short> image before ci.yml's
# `publish` job (5-6 minutes) had pushed it — "manifest unknown" every time,
# 100% reproducible, not a flake. workflow_run waits for CI to fully
# complete (success or failure) before this workflow even starts.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Manual recovery path: see ci.yml's workflow_dispatch comment.
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

# Deny by default at workflow level; each job below grants only what it needs.
permissions: {}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  release-please:
    name: release-please
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      # A PR opened with the default GITHUB_TOKEN does not trigger other
      # workflow runs (GitHub's anti-recursion guard on workflow-authored
      # events), so ci.yml would never run on this PR and its required
      # checks could never go green. RELEASE_PLEASE_TOKEN is a PAT so the PR
      # is authored by a real user instead. See docs/ci-setup.md.
      - uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5 # v4.1.3
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  promote-by-digest:
    name: Promote scanned image by digest (no rebuild)
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # GHCR requires a lowercase repository path; github.repository preserves
      # the org/repo's actual casing, which Docker rejects outright.
      - name: Normalize image name to lowercase
        run: echo "IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve source tag and target semver tag
        id: tags
        env:
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          echo "source=sha-${RELEASE_SHA:0:12}" >> "$GITHUB_OUTPUT"
          echo "target=${{ needs.release-please.outputs.tag_name }}" >> "$GITHUB_OUTPUT"
      # No `docker build` here on purpose: release-please only tags a commit that
      # already merged to main, which the ci.yml `publish` job already built,
      # scanned (Trivy) and pushed as sha-<short>. Retagging by digest is what
      # makes "the image that was tested is the image that is released" true.
      - name: Pull the already-scanned image by its CI tag
        run: docker pull "${IMAGE_NAME}:${{ steps.tags.outputs.source }}"
      - name: Capture source digest
        id: digest
        run: |
          digest=$(docker image inspect "${IMAGE_NAME}:${{ steps.tags.outputs.source }}" --format '{{index .RepoDigests 0}}' | cut -d@ -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Source digest: $digest"
      - name: Retag and push (promote by digest)
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${{ steps.tags.outputs.target }}" \
            "${IMAGE_NAME}@${{ steps.digest.outputs.digest }}"
      - name: Prove digest equality
        run: |
          docker pull "${IMAGE_NAME}:${{ steps.tags.outputs.target }}"
          promoted=$(docker image inspect "${IMAGE_NAME}:${{ steps.tags.outputs.target }}" --format '{{index .RepoDigests 0}}' | cut -d@ -f2)
          echo "Source digest:    ${{ steps.digest.outputs.digest }}"
          echo "Promoted digest:  $promoted"
          [[ "$promoted" == "${{ steps.digest.outputs.digest }}" ]] || { echo "DIGEST MISMATCH"; exit 1; }
          echo "Digest equality proven: same image, no rebuild."
