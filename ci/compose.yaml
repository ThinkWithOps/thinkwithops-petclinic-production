name: ${COMPOSE_PROJECT_NAME:-petclinic-ci}

# Self-hosted CI stack: Jenkins + local SonarQube (+ its Postgres) + Nexus.
# This is the "environments that can't use SaaS runners" path from
# docs/adr/0007-jenkins-and-nexus-responsibilities.md — it runs the SAME
# stage contract as .github/workflows/ci.yml, not a different pipeline.
#
# Host requirements (SonarQube):
#   - vm.max_map_count >= 262144 on the Docker host (SonarQube's embedded
#     Elasticsearch refuses to start otherwise). Set once per host:
#       sudo sysctl -w vm.max_map_count=262144
#     (persist via /etc/sysctl.d/99-sonarqube.conf if this host runs SonarQube
#     regularly).
#   - At least 2 GB RAM free for SonarQube alone; the full stack (Jenkins +
#     SonarQube + Postgres + Nexus) is comfortable at 6-8 GB total.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    user: "1000:1000"
    environment:
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
      CASC_JENKINS_CONFIG: /var/jenkins_home/casc.yaml
    volumes:
      - jenkins-home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${JENKINS_PORT:-8090}:8080"
      - "${JENKINS_AGENT_PORT:-50000}:50000"
    networks: [ci]
    mem_limit: ${JENKINS_MEMORY_LIMIT:-2g}
    restart: unless-stopped
    logging: *logging

  sonarqube-db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: sonar
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:?Run scripts/ci-stack-up.sh first}
    volumes:
      - sonarqube-db-data:/var/lib/postgresql/data
    networks: [ci]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U sonar -d sonar']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    mem_limit: 512m
    restart: unless-stopped
    logging: *logging

  sonarqube:
    # TODO: pin by digest once pulled on the target host — see jenkins comment above.
    image: sonarqube:25.4.0.105899-community
    depends_on:
      sonarqube-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:?Run scripts/ci-stack-up.sh first}
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
    ports:
      - "${SONARQUBE_PORT:-9000}:9000"
    networks: [ci]
    # Requires host vm.max_map_count >= 262144 — see file header.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:9000/api/system/status || exit 1']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    mem_limit: ${SONARQUBE_MEMORY_LIMIT:-2g}
    restart: unless-stopped
    logging: *logging

  nexus:
    # TODO: pin by digest once pulled on the target host — see jenkins comment above.
    image: sonatype/nexus3:3.79.1
    volumes:
      - nexus-data:/nexus-data
    ports:
      - "${NEXUS_PORT:-8081}:8081"
    networks: [ci]
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8081/service/rest/v1/status || exit 1']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    mem_limit: ${NEXUS_MEMORY_LIMIT:-1500m}
    restart: unless-stopped
    logging: *logging

networks:
  ci:
    driver: bridge

volumes:
  jenkins-home:
  sonarqube-db-data:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
  nexus-data:
