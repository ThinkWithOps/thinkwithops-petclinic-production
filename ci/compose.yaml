name: ${COMPOSE_PROJECT_NAME:-petclinic-ci}

# Self-hosted CI stack: Jenkins + local SonarQube (+ its Postgres) + Nexus.
# This is the "environments that can't use SaaS runners" path from
# docs/adr/0007-jenkins-and-nexus-responsibilities.md — it runs an EQUIVALENT
# stage contract to .github/workflows/ci.yml (differences: docs/ci-portability.md).
# Implementation prepared; runtime verification pending a real Docker engine run.
#
# Host requirements (SonarQube):
#   - vm.max_map_count >= 262144 on the Docker host (SonarQube's embedded
#     Elasticsearch refuses to start otherwise). Set once per host:
#       sudo sysctl -w vm.max_map_count=262144
#     (persist via /etc/sysctl.d/99-sonarqube.conf if this host runs SonarQube
#     regularly).
#   - At least 2 GB RAM free for SonarQube alone; the full stack (Jenkins +
#     SonarQube + Postgres + Nexus) is comfortable at 6-8 GB total.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    user: "1000:1000"
    # The docker socket is owned by the host's docker group; uid 1000 inside the
    # container needs that GID as a supplemental group to use it. DOCKER_GID is
    # written to ci/.env by scripts/ci-stack-up.sh (stat -c '%g' /var/run/docker.sock).
    group_add:
      - "${DOCKER_GID:?Run scripts/ci-stack-up.sh first}"
    # Compose substitutes ${VAR} in this file from ci/.env, but does NOT pass ci/.env
    # into the container on its own — casc.yaml reads these two, so list them.
    environment:
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
      CASC_JENKINS_CONFIG: /usr/share/jenkins/casc/casc.yaml
      JENKINS_ADMIN_USER: ${JENKINS_ADMIN_USER:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?Run scripts/ci-stack-up.sh first}
      # Testcontainers (MySqlIntegrationTests) connects to containers it creates here.
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
      # PostgresIntegrationTests enables Spring Boot's Docker Compose support
      # (spring.docker.compose.skip.in-tests=false), which runs `docker compose up
      # postgres` from docker-compose.yml on the host daemon. With a unix socket,
      # Spring Boot would resolve the published port's host as "localhost" — this
      # container — so name the host explicitly. No test is skipped or changed.
      SPRING_DOCKER_COMPOSE_HOST: host.docker.internal
    # `mvnw verify` runs INSIDE this container but starts its test databases on the
    # HOST daemon (mounted socket), so their published ports are on the host, not on
    # this container's localhost. host.docker.internal -> the host gateway on Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - jenkins-home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${JENKINS_PORT:-8090}:8080"
      - "${JENKINS_AGENT_PORT:-50000}:50000"
    networks: [ci]
    # Maven + Testcontainers + Trivy + Checkov all run inside this container.
    mem_limit: ${JENKINS_MEMORY_LIMIT:-3g}
    restart: unless-stopped
    logging: *logging

  sonarqube-db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: sonar
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:?Run scripts/ci-stack-up.sh first}
    volumes:
      - sonarqube-db-data:/var/lib/postgresql/data
    networks: [ci]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U sonar -d sonar']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    mem_limit: 512m
    restart: unless-stopped
    logging: *logging

  sonarqube:
    # Pinned by tag, NOT digest (unlike docker/compose.yaml); a digest can only be
    # resolved on a host that has pulled the image. Tag verified to exist on Docker Hub.
    image: sonarqube:25.4.0.105899-community
    depends_on:
      sonarqube-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:?Run scripts/ci-stack-up.sh first}
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
    ports:
      - "${SONARQUBE_PORT:-9000}:9000"
    networks: [ci]
    # Requires host vm.max_map_count >= 262144 — see file header.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      # The sonarqube image installs curl (and bash) but not wget. Require status UP:
      # the endpoint answers 200 with STARTING/DB_MIGRATION_RUNNING long before ready.
      test: [CMD-SHELL, 'curl --fail --silent http://127.0.0.1:9000/api/system/status | grep -q "\"status\":\"UP\""']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    mem_limit: ${SONARQUBE_MEMORY_LIMIT:-2g}
    restart: unless-stopped
    logging: *logging

  nexus:
    # Pinned by tag, NOT digest — see the sonarqube comment above.
    image: sonatype/nexus3:3.79.1
    volumes:
      - nexus-data:/nexus-data
    ports:
      - "${NEXUS_PORT:-8081}:8081"
    networks: [ci]
    healthcheck:
      # The nexus3 image is UBI-minimal: curl present (used by its own Dockerfile), no wget.
      # /service/rest/v1/status returns 503 until Nexus is ready to serve.
      test: [CMD-SHELL, 'curl --fail --silent --output /dev/null http://127.0.0.1:8081/service/rest/v1/status || exit 1']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    mem_limit: ${NEXUS_MEMORY_LIMIT:-1500m}
    restart: unless-stopped
    logging: *logging

networks:
  ci:
    driver: bridge

volumes:
  jenkins-home:
  sonarqube-db-data:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
  nexus-data:
