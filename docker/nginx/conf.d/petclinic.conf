server {
    listen 8080;
    server_name _;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Case-insensitive regex also blocks semicolon/path-parameter variants.
    location ~* ^/actuator(?:/|;|$) { return 404; }

    location / {
        # Docker DNS; resolve again after app container replacement.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $petclinic app:8080;
        proxy_pass http://$petclinic;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto ${PUBLIC_SCHEME};
        # Public Host already carries any nonstandard published port.
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_redirect off;
    }
}
