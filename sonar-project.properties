# Used by the local/Jenkins Sonar analysis (ci/compose.yaml's SonarQube).
# The GitHub Actions quality-gate job passes the equivalent as -D properties
# so both paths run the identical analysis — see docs/ci-portability.md.
sonar.projectKey=thinkwithops-petclinic-production
sonar.organization=thinkwithops
sonar.sources=src/main
sonar.tests=src/test
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Exclusions: compiled CSS is generated from src/main/scss by libsass-maven-plugin
# (see pom.xml), not hand-authored, and would otherwise skew duplication metrics.
sonar.exclusions=src/main/resources/static/resources/css/**
